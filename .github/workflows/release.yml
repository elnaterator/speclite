name: Release

# Publish the installer to npm when a vX.Y.Z tag is pushed (see specs/lite/rules.md).
# Auth is npm trusted publishing (OIDC): npmjs.com trusts this repo + this workflow file, so
# no token or secret exists. Renaming this file breaks publishing until the trusted publisher
# on npmjs.com is updated to match. Provenance is generated automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing (+ provenance)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # bundles npm 11; trusted publishing needs npm >= 11.5.1
          registry-url: 'https://registry.npmjs.org'

      - name: npm supports trusted publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v" \
            || { echo "::error::npm $v is older than 11.5.1 — trusted publishing unavailable"; exit 1; }

      # The tag must name the version being published — catches tagging before `make bump`.
      - name: Tag matches package.json
        run: |
          want="v$(node bin/version.js)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($want)"
            exit 1
          fi

      - name: Version check
        run: node bin/version.js --check

      - name: Installer dry-run (each target)
        run: |
          for target in claude copilot cursor codex opencode kiro; do
            node bin/install.js --only "$target" --dry-run >/dev/null
          done

      - name: Pack contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
